name: ACL Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

env:
  TURBO_TELEMETRY_DISABLED: 1
  SQLX_OFFLINE: 'true'
  MODRINTH_URL: https://modrinth.com/
  MODRINTH_API_BASE_URL: https://api.modrinth.com/
  MODRINTH_API_URL: https://api.modrinth.com/v2/
  MODRINTH_API_URL_V3: https://api.modrinth.com/v3/
  MODRINTH_SOCKET_URL: wss://api.modrinth.com/
  MODRINTH_LAUNCHER_META_URL: https://launcher-meta.modrinth.com/
  MODRINTH_ARCHON_BASE_URL: https://archon.modrinth.com/
  SHARED_INSTANCES_API_BASE_URL: https://shared-instances.modrinth.com/

concurrency:
  group: acl-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Enable pnpm via corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@12.11.2 --activate
          pnpm --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @modrinth/app run tauri build --config tauri-release.conf.json --bundles nsis

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out -Force | Out-Null
          Copy-Item target/release/ACL.exe out/
          Copy-Item target/release/bundle/nsis/*.exe out/ -ErrorAction SilentlyContinue
          Copy-Item target/release/bundle/nsis/*.nsis.zip out/ -ErrorAction SilentlyContinue
          Copy-Item target/release/bundle/nsis/*.sig out/ -ErrorAction SilentlyContinue
          Copy-Item target/release/bundle/nsis/latest.json out/ -ErrorAction SilentlyContinue
          Get-ChildItem out | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}
          if (-not (Test-Path out/ACL_*_x64-setup.nsis.zip)) {
            Write-Error "missing updater artifact: .nsis.zip was not generated (signing key not applied?)"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ACL-windows-x64
          path: out/*
          if-no-files-found: error
