name: ACL 功能建议
description: 为 ACL 启动器提出新功能或改进建议。
labels: [enhancement]
body:
  - type: checkboxes
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索[现有议题](https://github.com/anjiuErode/AC-Launcher/issues?q=is%3Aissue)，没有发现重复建议。
          required: true
  - type: textarea
    id: use-case
    attributes:
      label: 使用场景
      description: 描述你希望解决的问题。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的改进
      description: 描述你希望 ACL 怎么做。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可附上你考虑过的其他方案或参考截图。
