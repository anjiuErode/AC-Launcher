name: ACL 故障反馈
description: 报告 Windows 版 ACL 启动器的故障。
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索[现有议题](https://github.com/anjiuErode/AC-Launcher/issues?q=is%3Aissue)，没有发现重复反馈。
          required: true
  - type: input
    id: version
    attributes:
      label: ACL 版本
      description: 填写启动器显示的完整版本号。
      placeholder: 1.0.1-pre
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows 系统（x64）
      options:
        - Windows 10
        - Windows 11
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际表现
      description: 描述发生了什么。如有报错，请附上完整的错误文字。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 无法稳定复现时，请描述触发条件或出现频率。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期表现
  - type: textarea
    id: context
    attributes:
      label: 日志或截图
      description: 可附上相关日志和截图。提交前请移除凭据与个人信息。
